name: Anjuna
description: >-
  Anjuna Security provides a confidential-computing platform that lets organizations
  run existing applications inside hardware-based secure enclaves (Trusted Execution
  Environments) across AWS Nitro, AMD SEV, and Intel SGX without code changes, keeping
  data encrypted at rest, in transit, and in use. Its Seaglass platform, Policy Manager,
  Overwatch agentic-AI governance, and Northstar AI data clean room deliver hardware-rooted
  cryptographic attestation and policy-based access control for sensitive workloads and
  privacy-preserving AI. Anjuna is delivered as command-line runtime tooling and open-source
  attestation libraries rather than a public HTTP API.
